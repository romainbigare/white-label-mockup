name: Deploy mockup to GitHub Pages

# The mockup is a no-build static site: index.html plus ES modules under app/.
# This workflow uploads the repository as-is, so there is nothing to compile and
# nothing that can drift between what is committed and what is served.

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you publish any branch by hand while reviewing

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every module parses
        run: ./tools/syntax.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
