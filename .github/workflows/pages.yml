name: Deploy mockup to GitHub Pages

# The mockup is a no-build static site: index.html plus ES modules under app/.
# This workflow uploads the repository as-is, so there is nothing to compile and
# nothing that can drift between what is committed and what is served.

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you publish any branch by hand while reviewing

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every module parses
        run: ./tools/syntax.sh

      # Two copies of the same fact by two different routes. app/version.js
      # reaches the browser through the module cache with the rest of the code;
      # version.json is fetched with no-store. When they disagree, the visitor
      # is looking at a build older than this one — see app/core/freshness.js.
      - name: Stamp the build
        run: |
          SHA="${GITHUB_SHA::7}"
          NOW="$(date -u +%Y-%m-%dT%H:%MZ)"
          printf '{ "build": "%s", "builtAt": "%s" }\n' "$SHA" "$NOW" > version.json
          {
            echo "/* Generated at deploy time by .github/workflows/pages.yml."
            echo "   Locally this reads \"dev\" and no freshness check runs. */"
            echo "export const BUILD = '$SHA';"
            echo "export const BUILT_AT = '$NOW';"
          } > app/version.js
          cat version.json app/version.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
