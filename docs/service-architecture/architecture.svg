<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Wafra Farm App — service architecture</title>
  <desc>The active farms list sits at the centre of Wafra's Firebase. Wafra's Cloud Functions keep it right from purchases, contracts, prices and farm sizes. The app reads it to decide if a farm is active or read-only. MMC reads it to know which farms to analyse.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="800" fill="#FFFFFF"/>

  <!-- boundaries -->
  <rect x="20" y="60" width="220" height="300" rx="14" fill="none" stroke="#888780" stroke-dasharray="6 4"/>
  <text x="36" y="84" font-size="14" font-weight="bold" fill="#444441">The app (phone)</text>
  <rect x="20" y="480" width="220" height="230" rx="14" fill="none" stroke="#888780" stroke-dasharray="6 4"/>
  <text x="36" y="504" font-size="14" font-weight="bold" fill="#444441">Payment services</text>
  <rect x="270" y="60" width="540" height="640" rx="14" fill="none" stroke="#888780" stroke-dasharray="6 4"/>
  <text x="286" y="84" font-size="14" font-weight="bold" fill="#444441">Wafra's Firebase (Wafra's servers)</text>
  <rect x="840" y="60" width="250" height="420" rx="14" fill="none" stroke="#888780" stroke-dasharray="6 4"/>
  <text x="856" y="84" font-size="14" font-weight="bold" fill="#444441">MMC (supplier servers)</text>

  <!-- the app -->
  <rect x="50" y="112" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="135" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Payment gate</text>
  <text x="135" y="154" text-anchor="middle" font-size="12" fill="#185FA5">active or read-only</text>
  <rect x="50" y="196" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="135" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Owner's app</text>
  <text x="135" y="238" text-anchor="middle" font-size="12" fill="#185FA5">paywall, buys a step</text>
  <rect x="50" y="276" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="135" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Team member's app</text>
  <text x="135" y="318" text-anchor="middle" font-size="12" fill="#185FA5">co-owner, supervisor</text>

  <!-- payment services -->
  <rect x="50" y="525" width="170" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="135" y="545" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">RevenueCat</text>
  <text x="135" y="563" text-anchor="middle" font-size="12" fill="#534AB7">entitlements</text>
  <rect x="50" y="610" width="170" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="135" y="630" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">Apple / Google</text>
  <text x="135" y="648" text-anchor="middle" font-size="12" fill="#534AB7">take the money</text>

  <!-- Wafra's Firebase -->
  <rect x="440" y="100" width="200" height="80" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="2.5"/>
  <text x="540" y="126" text-anchor="middle" font-size="17" font-weight="bold" fill="#633806">activeFarms</text>
  <text x="540" y="148" text-anchor="middle" font-size="12" fill="#854F0B">one record per paid farm</text>
  <text x="540" y="166" text-anchor="middle" font-size="12" fill="#854F0B">MMC farm ID · tier · grace</text>

  <rect x="440" y="215" width="200" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="540" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Cloud Functions</text>
  <text x="540" y="259" text-anchor="middle" font-size="12" fill="#0F6E56">keepActiveFarms, surveyFarm</text>
  <text x="540" y="277" text-anchor="middle" font-size="12" fill="#0F6E56">redeemInvite, notify</text>

  <rect x="290" y="215" width="130" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="355" y="249" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Auth</text>
  <text x="355" y="269" text-anchor="middle" font-size="12" fill="#0F6E56">phone gives a UID</text>

  <rect x="290" y="330" width="500" height="155" rx="10" fill="none" stroke="#0F6E56"/>
  <text x="304" y="350" font-size="14" font-weight="bold" fill="#085041">Firestore</text>
  <rect x="305" y="362" width="230" height="105" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="420" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">People and farms</text>
  <text x="420" y="406" text-anchor="middle" font-size="12" fill="#0F6E56">users, farms, farmAccess</text>
  <text x="420" y="424" text-anchor="middle" font-size="12" fill="#0F6E56">invites, contacts</text>
  <text x="420" y="442" text-anchor="middle" font-size="12" fill="#0F6E56">suggestions, feedback</text>
  <rect x="555" y="362" width="220" height="105" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="665" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Payment data</text>
  <text x="665" y="406" text-anchor="middle" font-size="12" fill="#0F6E56">customers (RevenueCat copy)</text>
  <text x="665" y="424" text-anchor="middle" font-size="12" fill="#0F6E56">contracts, contractFarms</text>
  <text x="665" y="442" text-anchor="middle" font-size="12" fill="#0F6E56">pricing (final prices)</text>

  <rect x="305" y="520" width="230" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="420" y="545" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Purchase copier</text>
  <text x="420" y="565" text-anchor="middle" font-size="12" fill="#0F6E56">RevenueCat's extension</text>

  <rect x="620" y="725" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="700" y="747" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Wafra staff</text>
  <text x="700" y="767" text-anchor="middle" font-size="12" fill="#5F5E5A">prices, contracts</text>

  <!-- MMC -->
  <rect x="855" y="112" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="950" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Active farm IDs</text>
  <text x="950" y="154" text-anchor="middle" font-size="12" fill="#5F5E5A">synced from Wafra</text>
  <rect x="855" y="227" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="950" y="249" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Survey API</text>
  <text x="950" y="269" text-anchor="middle" font-size="12" fill="#5F5E5A">hectares, trees</text>
  <rect x="855" y="307" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="950" y="329" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Analytics API</text>
  <text x="950" y="349" text-anchor="middle" font-size="12" fill="#5F5E5A">maps, advice</text>
  <rect x="855" y="387" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="950" y="409" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Farm store</text>
  <text x="950" y="429" text-anchor="middle" font-size="12" fill="#5F5E5A">IDs, shapes, imagery</text>

  <!-- arrows -->
  <g fill="none" stroke="#5F5E5A" stroke-width="1.25">
    <line x1="222" y1="140" x2="437" y2="140" marker-end="url(#a)"/>
    <line x1="642" y1="140" x2="852" y2="140" marker-end="url(#a)"/>
    <line x1="540" y1="213" x2="540" y2="183" marker-end="url(#a)"/>
    <line x1="500" y1="297" x2="500" y2="359" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="600" y1="360" x2="600" y2="298" marker-end="url(#a)"/>
    <line x1="642" y1="255" x2="852" y2="255" marker-end="url(#a)"/>
    <path d="M222 304 L255 304 L255 415 L302 415" marker-end="url(#a)"/>
    <path d="M48 224 L32 224 L32 550 L47 550" marker-end="url(#a)"/>
    <line x1="135" y1="608" x2="135" y2="578" marker-end="url(#a)"/>
    <line x1="222" y1="550" x2="302" y2="550" marker-end="url(#a)"/>
    <path d="M537 550 L620 550 L620 470" marker-end="url(#a)"/>
    <line x1="700" y1="723" x2="700" y2="470" marker-end="url(#a)"/>
    <path d="M130 58 L130 36 L1070 36 L1070 335 L1048 335" marker-end="url(#a)"/>
  </g>
  <g font-size="11" fill="#5F5E5A">
    <text x="330" y="131" text-anchor="middle">reads</text>
    <text x="747" y="131" text-anchor="middle">MMC reads (own login)</text>
    <text x="548" y="204">keeps it right</text>
    <text x="747" y="246" text-anchor="middle">surveyFarm calls</text>
    <text x="600" y="28" text-anchor="middle">analytics calls: MMC farm ID + sign-in token (active farms only)</text>
    <text x="40" y="425">buys</text>
    <text x="545" y="567">copies purchases</text>
    <text x="708" y="600">writes</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#444441">
    <rect x="860" y="520" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="882" y="532">the app (phone)</text>
    <rect x="860" y="546" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="882" y="558">Wafra's Firebase</text>
    <rect x="860" y="572" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#BA7517" stroke-width="2"/>
    <text x="882" y="584">active farms list (the centre)</text>
    <rect x="860" y="598" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
    <text x="882" y="610">MMC, and Wafra staff</text>
    <rect x="860" y="624" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="882" y="636">payment services</text>
    <line x1="860" y1="657" x2="874" y2="657" stroke="#888780" stroke-dasharray="4 3"/>
    <text x="882" y="661">who runs it (boundary)</text>
  </g>
</svg>
