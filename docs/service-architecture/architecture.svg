<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Wafra Farm App — service architecture</title>
  <desc>farmService sits at the centre of Wafra's Firebase: one record per measured farm, active, read-only or removed. keepActiveFarms keeps it right from purchases, contracts and prices. The app reads it to show a farm active or read-only. Each change is pushed to MMC, which computes only active farms. The app calls MMC with a short farm pass signed by Wafra, never with its Firebase login. MMC sends survey results to a Wafra function, and never reads Wafra's Firestore.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="680" fill="#FFFFFF"/>

  <!-- boundaries -->
  <rect x="20" y="60" width="200" height="290" rx="14" fill="none" stroke="#888780" stroke-dasharray="6 4"/>
  <text x="36" y="84" font-size="14" font-weight="bold" fill="#444441">The app (phone)</text>
  <rect x="20" y="390" width="200" height="220" rx="14" fill="none" stroke="#888780" stroke-dasharray="6 4"/>
  <text x="36" y="414" font-size="14" font-weight="bold" fill="#444441">Payment services</text>
  <rect x="270" y="60" width="520" height="550" rx="14" fill="none" stroke="#888780" stroke-dasharray="6 4"/>
  <text x="286" y="84" font-size="14" font-weight="bold" fill="#444441">Wafra's Firebase (Wafra's servers)</text>
  <rect x="840" y="60" width="250" height="550" rx="14" fill="none" stroke="#888780" stroke-dasharray="6 4"/>
  <text x="856" y="84" font-size="14" font-weight="bold" fill="#444441">MMC (supplier servers)</text>

  <!-- the app -->
  <rect x="40" y="104" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="120" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Payment gate</text>
  <text x="120" y="146" text-anchor="middle" font-size="12" fill="#185FA5">reads farmService</text>
  <rect x="40" y="188" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="120" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Owner's app</text>
  <text x="120" y="230" text-anchor="middle" font-size="12" fill="#185FA5">paywall, buys a band</text>
  <rect x="40" y="272" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="120" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Team member's app</text>
  <text x="120" y="314" text-anchor="middle" font-size="12" fill="#185FA5">co-owner, supervisor</text>

  <!-- payment services -->
  <rect x="40" y="432" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="120" y="454" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">RevenueCat</text>
  <text x="120" y="474" text-anchor="middle" font-size="12" fill="#534AB7">basic, premium</text>
  <rect x="40" y="528" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="120" y="550" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">Apple / Google</text>
  <text x="120" y="570" text-anchor="middle" font-size="12" fill="#534AB7">take the money</text>

  <!-- Wafra's Firebase: data -->
  <rect x="290" y="104" width="230" height="92" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="405" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">People and farms</text>
  <text x="405" y="150" text-anchor="middle" font-size="12" fill="#0F6E56">users, farms, farmAccess</text>
  <text x="405" y="168" text-anchor="middle" font-size="12" fill="#0F6E56">invites, contacts</text>
  <text x="405" y="186" text-anchor="middle" font-size="12" fill="#0F6E56">suggestions, feedback</text>

  <rect x="290" y="300" width="230" height="92" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="405" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Payment data</text>
  <text x="405" y="346" text-anchor="middle" font-size="12" fill="#0F6E56">customers (RevenueCat copy)</text>
  <text x="405" y="364" text-anchor="middle" font-size="12" fill="#0F6E56">contracts, contractFarms</text>
  <text x="405" y="382" text-anchor="middle" font-size="12" fill="#0F6E56">pricing: bands (staff)</text>

  <rect x="290" y="432" width="230" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="405" y="454" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Purchase copier</text>
  <text x="405" y="474" text-anchor="middle" font-size="12" fill="#0F6E56">RevenueCat's extension</text>

  <rect x="290" y="528" width="230" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="405" y="550" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Auth</text>
  <text x="405" y="570" text-anchor="middle" font-size="12" fill="#0F6E56">phone sign-in gives a UID</text>

  <!-- Wafra's Firebase: farmService and the functions -->
  <rect x="560" y="104" width="210" height="80" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="2.5"/>
  <text x="665" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="#633806">farmService</text>
  <text x="665" y="152" text-anchor="middle" font-size="12" fill="#854F0B">one record per measured farm</text>
  <text x="665" y="170" text-anchor="middle" font-size="12" fill="#854F0B">status · level · services</text>

  <rect x="560" y="208" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="665" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">keepActiveFarms</text>
  <text x="665" y="250" text-anchor="middle" font-size="12" fill="#0F6E56">decides who has paid</text>

  <rect x="560" y="288" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#185FA5" stroke-width="2.5"/>
  <text x="665" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">getProviderPass</text>
  <text x="665" y="330" text-anchor="middle" font-size="12" fill="#0F6E56">signs the farm pass (KMS)</text>

  <rect x="560" y="368" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="665" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">onFarmServiceWritten</text>
  <text x="665" y="410" text-anchor="middle" font-size="12" fill="#0F6E56">+ providerReconcile (daily)</text>

  <rect x="560" y="448" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="665" y="470" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">providerSurveyResult</text>
  <text x="665" y="490" text-anchor="middle" font-size="12" fill="#0F6E56">saves survey results in farms</text>

  <rect x="560" y="528" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="665" y="550" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">checkFarms</text>
  <text x="665" y="570" text-anchor="middle" font-size="12" fill="#0F6E56">optional status check</text>

  <!-- MMC -->
  <rect x="865" y="104" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="965" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">MMC API</text>
  <text x="965" y="146" text-anchor="middle" font-size="12" fill="#5F5E5A">checks the farm pass</text>
  <rect x="865" y="188" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="965" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Farm list (copy)</text>
  <text x="965" y="230" text-anchor="middle" font-size="12" fill="#5F5E5A">status, level, services</text>
  <rect x="865" y="272" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="965" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Analysis jobs</text>
  <text x="965" y="314" text-anchor="middle" font-size="12" fill="#5F5E5A">new image: check the list</text>
  <rect x="865" y="356" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="965" y="378" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Webhook</text>
  <text x="965" y="398" text-anchor="middle" font-size="12" fill="#5F5E5A">updates the farm list</text>
  <rect x="865" y="440" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="965" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Survey</text>
  <text x="965" y="482" text-anchor="middle" font-size="12" fill="#5F5E5A">hectares, trees</text>
  <text x="965" y="540" text-anchor="middle" font-size="12" fill="#5F5E5A">Keeps farm IDs, shapes, results.</text>
  <text x="965" y="558" text-anchor="middle" font-size="12" fill="#5F5E5A">No names, phones or user IDs.</text>

  <!-- arrows -->
  <g fill="none" stroke="#5F5E5A" stroke-width="1.25">
    <line x1="202" y1="132" x2="287" y2="132" marker-end="url(#a)"/>
    <path d="M202 300 H236 V246 H545 V316 H557" marker-end="url(#a)"/>
    <path d="M120 58 V38 H1045 V101" marker-end="url(#a)"/>
    <path d="M38 216 H28 V460 H37" marker-end="url(#a)"/>
    <line x1="120" y1="526" x2="120" y2="491" marker-end="url(#a)"/>
    <line x1="202" y1="460" x2="287" y2="460" marker-end="url(#a)"/>
    <line x1="405" y1="430" x2="405" y2="395" marker-end="url(#a)"/>
    <line x1="665" y1="206" x2="665" y2="187" marker-end="url(#a)"/>
    <path d="M772 144 H782 V384 H773" marker-end="url(#a)"/>
    <line x1="772" y1="404" x2="862" y2="404" marker-end="url(#a)"/>
    <path d="M1067 384 H1081 V216 H1068" marker-end="url(#a)"/>
    <line x1="965" y1="270" x2="965" y2="247" marker-end="url(#a)"/>
    <line x1="863" y1="472" x2="773" y2="472" marker-end="url(#a)"/>
    <line x1="856" y1="556" x2="773" y2="556" marker-end="url(#a)"/>
  </g>
  <g font-size="11" fill="#5F5E5A">
    <text x="575" y="30" text-anchor="middle">every call to MMC carries the farm pass only, never the Firebase login</text>
    <text x="245" y="110" text-anchor="middle">Firebase</text>
    <text x="245" y="124" text-anchor="middle">login</text>
    <text x="390" y="240" text-anchor="middle">asks for a farm pass</text>
    <text x="242" y="452" text-anchor="middle">purchases</text>
    <text x="815" y="396" text-anchor="middle">push</text>
    <text x="815" y="464" text-anchor="middle">results</text>
    <text x="815" y="548" text-anchor="middle">check</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#444441">
    <rect x="20" y="636" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="42" y="648">the app (phone)</text>
    <rect x="160" y="636" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="182" y="648">Wafra's Firebase</text>
    <rect x="310" y="636" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#BA7517" stroke-width="2"/>
    <text x="332" y="648">farmService (the centre)</text>
    <rect x="510" y="636" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#185FA5" stroke-width="2"/>
    <text x="532" y="648">the farm pass</text>
    <rect x="650" y="636" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
    <text x="672" y="648">MMC</text>
    <rect x="730" y="636" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="752" y="648">payment services</text>
    <line x1="890" y1="643" x2="904" y2="643" stroke="#888780" stroke-dasharray="4 3"/>
    <text x="912" y="648">who runs it (boundary)</text>
  </g>
</svg>
